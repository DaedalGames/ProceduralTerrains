name: Renderer experiments

on:
  pull_request:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Test renderer experiments
        run: node --test tests/*.node.mjs
      - name: Install dependencies
        run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      - name: Test frontend
        run: npm test
      - name: Check terrain package
        run: npm run check:lib
      - name: Build independent Three.js example
        run: |
          npm ci --prefix examples/three-finite-terrain
          npm run build --prefix examples/three-finite-terrain
      - name: Install WebGL test browser
        run: npx playwright install --with-deps chromium
      - name: Check terrain WebGL integration
        run: |
          npm run test:lib:browser
          npm run test:lib:worlds
      - name: Build frontend
        run: npm run build
